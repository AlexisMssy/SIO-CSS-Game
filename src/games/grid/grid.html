<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIO CSS Game — Atelier CSS Grid</title>
    <link rel="stylesheet" href="../../style/global.css">
    <link rel="icon" type="image/x-icon" href="../../../public/favicon.ico">
</head>

<body>
    <header>SIO CSS Game</header>
    <nav class="main-nav" aria-label="Navigation principale"></nav>

    <main id="game">
        <div class="level-desc" id="level-text"></div>
        <div id="level-counter" class="level-counter" aria-live="polite"></div>
        <div id="score-display" class="score-display" aria-live="polite">Points: 0</div>
        <div id="level-list" class="level-list"></div>

        <label for="code-input">CSS du défi</label>
        <textarea id="code-input" aria-label="CSS du défi" placeholder="#grid {\n  display: grid;\n}"></textarea>
        <button id="test-btn">Appliquer et vérifier</button>

        <div id="preview">
            <div id="grid" class="grid-layout">
                <div id="grid-card-featured" class="card">01 <strong>Structure</strong></div>
                <div id="grid-card-main" class="card">02 <strong>Colonnes</strong></div>
                <div id="grid-card-side" class="card">03 <strong>Espacement</strong></div>
                <div class="card">04 <strong>Alignement</strong></div>
                <div class="card">05 <strong>Zones</strong></div>
                <div class="card">06 <strong>Placement</strong></div>
                <div class="card">07 <strong>Adaptation</strong></div>
                <div class="card">08 <strong>Composition</strong></div>
            </div>
            <h3 class="grid-puzzle-title">Atelier de placement : puzzle A–D</h3>
            <div id="grid-puzzle" aria-label="Grille de placement à quatre colonnes et trois lignes">
                <div id="puzzle-a">A</div>
                <div id="puzzle-b">B</div>
                <div id="puzzle-c">C</div>
                <div id="puzzle-d">D</div>
            </div>
        </div>

        <div id="status"></div>
        <button id="next-level">Niveau suivant</button>

        <div id="game-end" style="display:none;">
            <h2>Jeu terminé</h2>
            <p id="final-score"></p>
            <button id="restart-btn">Rejouer</button>
        </div>
    </main>

    <script src="../../utils/utils.js"></script>
    <script src="./grid-atelier.js"></script>
    <script>
        // Marque le lien de navigation actif
        markActiveNavLink();
    </script>

    <footer class="site-footer">
        © <span data-current-year>2025</span> — SIO CSS Game
    </footer>
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="alexMssy" data-description="Support me on Buy me a coffee!" data-message="" data-color="#BD5FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body>

</html>
