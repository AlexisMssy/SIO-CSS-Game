name: Deploy Static Website to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Verify secrets are configured
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "❌ AZURE_CREDENTIALS secret is missing!"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 🧪 Run localStorage and score tests
      - name: Run game logic tests
        run: |
          echo "🧪 Running localStorage and score calculation tests..."
          node test.js
          node --test html-levels.test.js selectors-levels.test.js coding-games.test.js

      # 🔧 Install linters
      - name: Install linters (HTMLHint, Stylelint, ESLint)
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint@8
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          mkdir -p reports

      # 🔍 Lint HTML + export report
      - name: Lint HTML files
        id: lint_html
        continue-on-error: true
        run: |
          htmlhint "**/*.html" -f json > reports/htmlhint-report.json

      # 🔍 Lint CSS files
      - name: Lint CSS files
        id: lint_css
        continue-on-error: true
        run: |
          stylelint "**/*.css" --ignore-path .gitignore --formatter json > reports/stylelint-report.json

      # 🔍 Lint JavaScript files
      - name: Lint JavaScript files
        id: lint_js
        continue-on-error: true
        run: |
          eslint "**/*.js" --ignore-path .gitignore --format json > reports/eslint-report.json

      # 📤 Upload lint reports
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: reports/

      # ❌ Fail if any linter found errors
      - name: Check for linting errors
        if: always()
        run: |
          echo "HTMLHint: ${{ steps.lint_html.outcome }}"
          echo "Stylelint: ${{ steps.lint_css.outcome }}"
          echo "ESLint: ${{ steps.lint_js.outcome }}"

          if [[ "${{ steps.lint_html.outcome }}" != "success" || "${{ steps.lint_css.outcome }}" != "success" || "${{ steps.lint_js.outcome }}" != "success" ]]; then
            echo "Linting failed; deployment is blocked."
            exit 1
          fi

      # 📦 Préparer les assets publics à la racine
      - name: Copy public assets to package root
        run: |
          if [ -d "public" ]; then
            echo "Copie de public/. vers le dossier de déploiement..."
            cp -R public/. .
            ls -l robots.txt sitemap.xml || true
          else
            echo "Pas de dossier public/ détecté - étape ignorée."
          fi

      # 🚀 Deploy
      - name: Deploy to Azure Web App
        if: success()
        uses: azure/webapps-deploy@v3
        with:
          app-name: "SIO-CSS-Game"
          package: "."
