name: Deploy Static Website to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ✅ Verify secrets are configured
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "❌ AZURE_CREDENTIALS secret is missing!"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 📥 Outillage de développement (Playwright), jamais déployé
      - name: Install dev tools (Playwright + Chromium)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 🧪 Run localStorage and score tests
      - name: Run game logic tests
        run: |
          echo "🧪 Running localStorage and score calculation tests..."
          node test.js
          node --test html-levels.test.js selectors-levels.test.js coding-games.test.js progress.test.js build.test.js measure.test.js

      # 🔧 Install linters
      - name: Install linters (HTMLHint, Stylelint, ESLint)
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint@8
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          mkdir -p reports

      # 🔍 Lint HTML + export report
      - name: Lint HTML files
        id: lint_html
        continue-on-error: true
        run: |
          htmlhint "**/*.html" --ignore "dist/**,node_modules/**,reports/**,playwright-report/**,test-results/**" -f json > reports/htmlhint-report.json

      # 🔍 Lint CSS files
      - name: Lint CSS files
        id: lint_css
        continue-on-error: true
        run: |
          stylelint "**/*.css" --config-basedir "$(npm root -g)" --ignore-path .gitignore --formatter json > reports/stylelint-report.json

      # 🔍 Lint JavaScript files
      - name: Lint JavaScript files
        id: lint_js
        continue-on-error: true
        run: |
          eslint "**/*.js" --ignore-path .gitignore --format json > reports/eslint-report.json

      # 📤 Upload lint reports
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: reports/

      # ❌ Fail if any linter found errors
      - name: Check for linting errors
        if: always()
        run: |
          echo "HTMLHint: ${{ steps.lint_html.outcome }}"
          echo "Stylelint: ${{ steps.lint_css.outcome }}"
          echo "ESLint: ${{ steps.lint_js.outcome }}"

          if [[ "${{ steps.lint_html.outcome }}" != "success" || "${{ steps.lint_css.outcome }}" != "success" || "${{ steps.lint_js.outcome }}" != "success" ]]; then
            echo "Linting failed; deployment is blocked."
            exit 1
          fi

      # 📦 Construire le paquet : liste d'autorisation (index.html, page Google, src/, contenu de public/)
      - name: Build deploy package (dist/)
        run: |
          node build.js
          find dist -type f | sort

      # 📏 Mesures navigateur (§5.2) : bloquantes pour les pages de measure-blocking.txt
      - name: Browser measurements (overflow, 44px targets, contrast)
        run: node measure.js

      # 🚀 Deploy (dist/ uniquement ; clean supprime en ligne tout fichier absent de dist/)
      - name: Deploy to Azure Web App
        if: success()
        uses: azure/webapps-deploy@v3
        with:
          app-name: "SIO-CSS-Game"
          package: dist
          clean: true
